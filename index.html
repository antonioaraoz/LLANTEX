<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14181d">
<title>LLANTEX PRO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* VOICE: calma de taller ordenado, cero jerga, una sola acción fuerte por pantalla
   IDEA: el cuaderno de caja del dueño convertido en botones grandes
   PICTURE: la banda de rodadura (dibujo de llanta) como franja de marca y el botón rojo Nueva venta
   COLOUR and TYPE: blanco, tinta asfalto #14181d, rojo señal #d4261c solo para Nueva venta; letra del sistema, grande
   LAYOUT: tablet con menú lateral; celular con barra superior y menú inferior */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121417);--ink:light-dark(#14181d,#eef0f2);--soft:light-dark(#f2f3f5,#1c1f24);--line:light-dark(#dfe2e6,#2c3037);--mut:light-dark(#5b636d,#a3aab3);--red:#d4261c;--redh:#b81f16;--asf:#14181d;--ok:light-dark(#1d7a46,#5fd08f);--okbg:light-dark(#e7f5ec,#15281d);--warn:light-dark(#8a5a00,#f2c35b);--warnbg:light-dark(#fff4d9,#2b2412);--bad:light-dark(#b42318,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
h1{font-size:30px;line-height:1.1;margin:0 0 6px;text-wrap:balance}h2{font-size:22px;margin:0 0 12px}h3{font-size:18px;margin:0 0 8px}
p{margin:0 0 12px}.mut{color:var(--mut)}.small{font-size:14px}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg);font-size:18px}
input:focus,select:focus,button:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
label{display:block;font-weight:600;margin:14px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:17px;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--asf);color:#fff;border-color:var(--asf)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}.btn.red:hover{background:var(--redh)}
.btn.full{width:100%}.btn.danger{color:var(--bad);border-color:currentColor}
.ico{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tread{height:14px;background:repeating-linear-gradient(115deg,var(--asf) 0 14px,transparent 14px 22px),var(--soft)}
.card{border:1.5px solid var(--line);border-radius:16px;padding:18px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.stack>*+*{margin-top:14px}
.err{color:var(--bad);font-weight:600;min-height:24px;margin-top:8px}
.pill{display:inline-block;white-space:nowrap;padding:2px 10px;border-radius:99px;font-size:14px;font-weight:600;background:var(--soft)}
.pill.bad{background:light-dark(#fde8e7,#2d1514);color:var(--bad)}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}
/* pantallas de acceso */
.gate{min-height:100dvh;display:flex;flex-direction:column}
.gate main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .box{width:100%;max-width:460px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand b{font-size:26px;letter-spacing:.5px}.brand svg{width:44px;height:44px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.user{min-height:110px;flex-direction:column;gap:6px}
.av{width:48px;height:48px;border-radius:50%;background:var(--asf);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}
/* app */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100dvh}
.side{background:var(--asf);color:#e9ecef;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh}
.side .brand{color:#fff;margin:0 6px 16px}.side .brand b{font-size:20px}.side .brand svg{width:34px;height:34px}
.nav{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 12px;border-radius:10px;border:0;background:none;color:inherit;font-weight:600;font-size:16px;cursor:pointer;text-align:left;width:100%}
.nav:hover{background:#ffffff14}.nav[aria-current=page]{background:#ffffff24;color:#fff}
.nav .soon{margin-left:auto;font-size:12px;opacity:.6;font-weight:500}
.side .who{margin-top:auto;padding:12px;border-top:1px solid #ffffff22;font-size:14px}
.top{display:none}
.content{padding:24px clamp(16px,3vw,36px) 40px;max-width:1100px;width:100%}
.hello{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;margin-bottom:20px}
.nv{min-height:76px;font-size:22px;padding:0 30px;border-radius:16px}
.nv .ico{width:30px;height:30px}
.kpi{background:var(--soft);border-radius:14px;padding:16px}.kpi .n{font-size:28px;font-weight:700}
.list{border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px}.tabs .btn{flex:none}
.tabs .btn[aria-pressed=true]{background:var(--asf);color:#fff;border-color:var(--asf)}
.bottom{display:none}
/* diálogo propio */
.dlg{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.dlg .card{max-width:440px;width:100%}
.dlg .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.dlg .acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--asf);color:#fff;padding:14px 20px;border-radius:12px;font-weight:600;z-index:10;max-width:90vw}
@media(max-width:820px){
 .shell{display:block;padding-bottom:84px}.side{display:none}
 .top{display:flex;align-items:center;justify-content:space-between;background:var(--asf);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
 .top .brand{margin:0;color:#fff}.top .brand b{font-size:19px}.top .brand svg{width:30px;height:30px}
 .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1.5px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
 .bottom button{border:0;background:none;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--mut)}
 .bottom button[aria-current=page]{color:var(--ink)}
 .bottom .mid{color:var(--red)}
 .nv{width:100%}
 h1{font-size:26px}
}
.cpw{border:1.5px solid var(--line);border-radius:14px;padding:18px;background:#fff;color:#111;max-width:420px}
.cp{font:14px/1.45 ui-monospace,Menlo,Consolas,monospace}.cpl{margin:10px 0;padding:8px 0;border-top:1px dashed #999;border-bottom:1px dashed #999}
.cpt{width:100%;border-collapse:collapse}.cpt td{padding:3px 0;vertical-align:top}.cpt td:last-child{text-align:right;white-space:nowrap;padding-left:8px}.cpt .tt td{font-weight:700;font-size:1.15em;border-top:1px dashed #999;padding-top:6px}
#print{display:none}
#print .rep{font-size:12px;color:#000}#print .rep .kpi,#print .rep .card{border:1px solid #bbb;background:#fff;break-inside:avoid;margin-bottom:8px}#print .rep .kgrid,#print .rep .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kgrid .n{font-size:24px}
.paybar{bottom:16px}@media(max-width:820px){.paybar{bottom:84px}}
@media print{body>*:not(#print){display:none!important}#print{display:block;color:#000;background:#fff}#print .ticket{width:72mm;font-size:12px}#print .a4{max-width:180mm;margin:0 auto;font-size:13px}@page{margin:4mm}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-logo" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#14181d"/><circle cx="24" cy="24" r="21" fill="none" stroke="#d4261c" stroke-width="3" stroke-dasharray="5 4"/><circle cx="24" cy="24" r="10" fill="#c9ced4"/><circle cx="24" cy="24" r="4" fill="#14181d"/></symbol>
 <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
 <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/><path d="M13 9v4M11 11h4"/></symbol>
 <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></symbol>
 <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14 6a4 4 0 0 0 5 5l-9 9a2 2 0 0 1-3-3l9-9a4 4 0 0 0-2-2z"/></symbol>
 <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M16 4a3.5 3.5 0 0 1 0 7M22 20c0-3-2-5-5-5.7"/></symbol>
 <symbol id="i-truck" viewBox="0 0 24 24"><path d="M2 6h12v10H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
 <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
 <symbol id="i-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></symbol>
 <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></symbol>
 <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></symbol>
 <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M4 5h16"/></symbol>
 <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
 <symbol id="i-more" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
</svg>
<div id="app"></div>

<script>
{
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=n=>`<svg class="ico" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const logo=`<svg aria-hidden="true"><use href="#i-logo"/></svg>`;
const fecha=t=>new Date(t).toLocaleString('es-PE',{dateStyle:'medium',timeStyle:'short'});
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function dialog({title,body,ok='Aceptar',cancel='Cancelar',danger=false}){return new Promise(res=>{const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(body)}</p><div class="acts">${cancel?`<button class="btn" data-a="0">${esc(cancel)}</button>`:''}<button class="btn ${danger?'red':'dark'}" data-a="1">${esc(ok)}</button></div></div>`;d.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a){d.remove();res(a.dataset.a==='1')}});document.body.append(d);d.querySelector('[data-a="1"]').focus()})}

/* ---------- base de datos local (IndexedDB) ---------- */
const STORES=['meta','users','audit','products','clients','vehicles','sales','services','suppliers','purchases','cash','moves'];
let DB;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('llantex',2);r.onupgradeneeded=()=>{for(const s of STORES)if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})};r.onsuccess=()=>{DB=r.result;res()};r.onerror=()=>rej(r.error)})}
const tx=(s,m='readonly')=>DB.transaction(s,m).objectStore(s);
const req=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});
const all=s=>req(tx(s).getAll());
const get=(s,id)=>req(tx(s).get(id));
const put=(s,o)=>req(tx(s,'readwrite').put(o));
async function meta(k,v){if(v===undefined){const r=await get('meta',k);return r?r.v:undefined}return put('meta',{id:k,v})}

/* ---------- contraseñas con hash (PBKDF2) ---------- */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPass(pass,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256))}

/* ---------- registro de cambios ---------- */
let ME=null;
async function log(accion,detalle=''){await put('audit',{id:uid(),t:Date.now(),user:ME?ME.nombre:'Sistema',rol:ME?ME.rol:'',accion,detalle})}

/* ---------- guardar archivo (USB, memoria, compartir) ---------- */
async function saveFile(name,text){
 try{const c=window.claude&&await window.claude.use('downloads');if(c){await c.save({filename:name,data:text});return true}}catch(e){}
 const blob=new Blob([text],{type:'application/json'});
 const f=new File([blob],name,{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true}
async function shareFile(name,text){const f=new File([text],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}return false}

/* ---------- copias de seguridad ---------- */
async function buildBackup(){const data={};for(const s of STORES)data[s]=await all(s);const body=JSON.stringify(data);const sum=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(body)));return JSON.stringify({app:'LLANTEX PRO',version:1,creado:new Date().toISOString(),por:ME.nombre,sum,data})}
async function checkBackup(text){let o;try{o=JSON.parse(text)}catch(e){throw new Error('El archivo no es una copia de LLANTEX PRO.')}
 if(o.app!=='LLANTEX PRO'||!o.data)throw new Error('El archivo no es una copia de LLANTEX PRO.');
 const sum=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(o.data))));
 if(sum!==o.sum)throw new Error('La copia está dañada o fue modificada. No se restauró nada.');
 if(!o.data.users||!o.data.users.some(u=>u.rol==='admin'&&u.activo))throw new Error('La copia no tiene un administrador. No se restauró nada.');
 return o}
async function restoreBackup(text){const o=await checkBackup(text);
 const t=DB.transaction(STORES,'readwrite');for(const s of STORES){const st=t.objectStore(s);st.clear();for(const r of(o.data[s]||[]))st.put(r)}
 await new Promise((a,b)=>{t.oncomplete=a;t.onerror=()=>b(t.error)});return o}

/* ---------- pantallas de acceso ---------- */
const app=$('#app');
function gate(inner){app.innerHTML=`<div class="gate"><div class="tread"></div><main><div class="box">${inner}</div></main></div>`}

async function viewSetup(){
 gate(`<div class="brand">${logo}<b>LLANTEX PRO</b></div>
 <h1>Bienvenido</h1><p class="mut">Vamos a preparar la app. Solo toma un minuto.</p>
 <form id="f" novalidate>
 <label for="neg">Nombre de la tienda</label><input id="neg" autocomplete="organization" placeholder="Llantas San Martín">
 <label for="nom">Tu nombre (administrador)</label><input id="nom" autocomplete="name" placeholder="Carlos">
 <label for="p1">Crea una contraseña</label><input id="p1" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
 <label for="p2">Repite la contraseña</label><input id="p2" type="password" autocomplete="new-password">
 <div class="err" id="e" role="alert"></div>
 <button class="btn dark full" style="margin-top:8px">Empezar</button></form>`);
 $('#f').onsubmit=async e=>{e.preventDefault();const neg=$('#neg').value.trim(),nom=$('#nom').value.trim(),p1=$('#p1').value,p2=$('#p2').value;
  if(!neg)return $('#e').textContent='Escribe el nombre de la tienda.';
  if(!nom)return $('#e').textContent='Escribe tu nombre.';
  if(p1.length<6)return $('#e').textContent='La contraseña debe tener al menos 6 caracteres.';
  if(p1!==p2)return $('#e').textContent='Las contraseñas no coinciden.';
  const salt=uid();const u={id:uid(),nombre:nom,rol:'admin',salt,hash:await hashPass(p1,salt),activo:true,creado:Date.now()};
  await put('users',u);await meta('negocio',neg);await meta('instalado',Date.now());ME=u;await log('Instalación','Se creó la tienda y el administrador');
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  ME=null;viewLogin()}}

async function viewLogin(){
 const users=(await all('users')).filter(u=>u.activo).sort((a,b)=>a.nombre.localeCompare(b.nombre));const neg=await meta('negocio');
 gate(`<div class="brand">${logo}<b>LLANTEX PRO</b></div><h1>${esc(neg)}</h1><p class="mut">Toca tu nombre para entrar.</p>
 <div class="users">${users.map(u=>`<button class="btn user" data-u="${esc(u.id)}"><span class="av">${esc(u.nombre[0].toUpperCase())}</span>${esc(u.nombre)}<span class="small mut">${u.rol==='admin'?'Administrador':'Trabajador'}</span></button>`).join('')}</div>
 <form id="f" hidden novalidate style="margin-top:18px"><label for="p" id="pl">Contraseña</label><input id="p" type="password" autocomplete="current-password"><div class="err" id="e" role="alert"></div><button class="btn dark full">${ico('lock')}Entrar</button></form>`);
 let sel=null;
 app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{sel=users.find(u=>u.id===b.dataset.u);app.querySelectorAll('[data-u]').forEach(x=>x.classList.toggle('dark',x===b));$('#f').hidden=false;$('#pl').textContent='Contraseña de '+sel.nombre;$('#e').textContent='';$('#p').value='';$('#p').focus()});
 $('#f').onsubmit=async e=>{e.preventDefault();if(!sel)return;
  const fails=(await meta('fails_'+sel.id))||{n:0,t:0};if(fails.n>=5&&Date.now()-fails.t<60000)return $('#e').textContent='Demasiados intentos. Espera un minuto.';
  if(await hashPass($('#p').value,sel.salt)!==sel.hash){await meta('fails_'+sel.id,{n:fails.n+1,t:Date.now()});return $('#e').textContent='Contraseña incorrecta.'}
  await meta('fails_'+sel.id,{n:0,t:0});ME=sel;try{sessionStorage.setItem('lx_me',sel.id)}catch(e){}await log('Ingreso');viewApp(location.hash.slice(1)||'inicio')}}

/* ---------- app principal ---------- */
const MENU=[['inicio','Inicio','home'],['venta','Nueva venta','cart'],['inventario','Inventario','box'],['servicios','Servicios','tool'],['clientes','Clientes','users'],['compras','Compras','truck',0,1],['reportes','Reportes','chart',0,1],['caja','Caja','cash'],['ajustes','Ajustes','gear']];
let CUR='inicio';
async function viewApp(v){
 if(v!=='mas'&&!MENU.some(m=>m[0]===v&&(!m[4]||ME.rol==='admin')))v='inicio';CUR=v;const neg=await meta('negocio');
 app.innerHTML=`<div class="shell">
 <aside class="side"><div class="brand">${logo}<b>LLANTEX PRO</b></div>
 ${MENU.filter(m=>!m[4]||ME.rol==='admin').map(m=>`<button class="nav" data-v="${m[0]}" ${m[0]===v?'aria-current="page"':''}>${ico(m[2])}${m[1]}${m[3]?`<span class="soon">pronto</span>`:''}</button>`).join('')}
 <div class="who"><b>${esc(ME.nombre)}</b><br>${ME.rol==='admin'?'Administrador':'Trabajador'}<br><button class="nav" id="out" style="padding:0;min-height:40px">${ico('lock')}Salir</button></div></aside>
 <header class="top"><div class="brand">${logo}<b>${esc(neg)}</b></div><button class="btn" id="out2" style="min-height:44px;background:none;color:#fff;border-color:#ffffff55">Salir</button></header>
 <main class="content" id="c"></main>

const money=n=>'S/ '+(Math.round((+n||0)*100)/100).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
function normMedida(s){s=String(s||'').toUpperCase().replace(/\s+/g,' ').trim();const m=s.replace(/[^0-9.]/g,' ').trim().split(/\s+/);const d=s.replace(/[^0-9]/g,'');
 let a,b,c;if(m.length>=3){[a,b,c]=m}else if(/^\d{7}$/.test(d)){a=d.slice(0,3);b=d.slice(3,5);c=d.slice(5)}
 if(a&&b&&c&&/^\d{3}$/.test(a)&&/^\d{2}$/.test(b)&&/^\d{2}(\.5)?$/.test(c))return `${a}/${b}R${c}`;return s}
const dig=s=>String(s||'').replace(/[^0-9]/g,'');
const low=p=>p.stock<=p.min;
const isAdmin=()=>ME&&ME.rol==='admin';
let INV={q:'',low:false};
async function products(){return(await all('products')).filter(p=>p.activo!==false)}
async function addMove(p,cant,tipo,motivo){await put('moves',{id:uid(),t:Date.now(),prod:p.id,desc:`${p.medida} ${p.marca}`,tipo,cant,antes:p.stock-cant,despues:p.stock,motivo,user:ME.nombre})}

async function inventario(c){
 const ps=await products();const bajos=ps.filter(low).length;const uds=ps.reduce((s,p)=>s+p.stock,0);const val=ps.reduce((s,p)=>s+p.stock*p.costo,0);
 c.innerHTML=`<div class="hello"><div><h1>Inventario</h1><p class="mut" style="margin:0">${ps.length} modelos · ${uds} llantas${isAdmin()?' · valor al costo '+money(val):''}</p></div>${isAdmin()?`<button class="btn dark" id="new">+ Agregar llanta</button>`:''}</div>
 <label for="q" class="small" style="margin-top:0">Buscar por medida, marca o código</label>
 <input id="q" type="search" inputmode="search" placeholder="205 55 16" value="${esc(INV.q)}" autocomplete="off">
 <div class="tabs" style="margin:12px 0"><button class="btn" data-f="0" aria-pressed="${!INV.low}">Todas</button><button class="btn" data-f="1" aria-pressed="${INV.low}">Stock bajo${bajos?` (${bajos})`:''}</button></div>
 <div id="il"></div>`;
 const draw=()=>{const q=INV.q.trim().toLowerCase(),qd=dig(q);
  let r=ps.filter(p=>!INV.low||low(p)).filter(p=>!q||(qd.length>=3&&dig(p.medida).includes(qd))||[p.marca,p.modelo,p.codigo,p.medida].join(' ').toLowerCase().includes(q));
  r.sort((a,b)=>a.medida.localeCompare(b.medida)||a.marca.localeCompare(b.marca));
  $('#il').innerHTML=!ps.length?`<div class="card"><h3>Registra tu primera llanta</h3><p class="mut">Agrega cada modelo con su medida, precio y cuántas tienes. Luego las ventas descontarán el stock solas.</p>${isAdmin()?'<button class="btn dark" id="new2">+ Agregar llanta</button>':'<p class="mut">Pide al administrador que cargue el inventario.</p>'}</div>`
  :!r.length?`<div class="card"><p style="margin:0">No hay llantas que coincidan con "${esc(INV.q)}".</p></div>`
  :`<div class="list">${r.map(p=>`<button class="row" data-p="${esc(p.id)}" style="width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;font:inherit;color:inherit;flex-wrap:nowrap;align-items:flex-start"><div><b style="font-size:19px">${esc(p.medida)}</b> <span class="small mut">${esc(p.carga)}${esc(p.vel)}</span><div class="small mut">${esc(p.marca)} ${esc(p.modelo)} · ${esc(p.codigo)}</div></div><div style="text-align:right"><b>${money(p.precio)}</b><div><span class="pill ${p.stock<=0?'bad':low(p)?'warn':'ok'}">${p.stock<=0?'Agotado':p.stock+' en stock'}</span></div></div></button>`).join('')}</div>`;
  $('#il').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>ficha(c,b.dataset.p));
  const n2=$('#new2');if(n2)n2.onclick=()=>formProd(c)};
 draw();
 let tm;$('#q').oninput=e=>{INV.q=e.target.value;clearTimeout(tm);tm=setTimeout(draw,150)};
 c.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{INV.low=b.dataset.f==='1';inventario(c)});
 const n=$('#new');if(n)n.onclick=()=>formProd(c)}

const F=[['marca','Marca','Goodyear','text',1],['medida','Medida','205/55R16','text',1],['modelo','Modelo','Assurance','text',0],['carga','Índice de carga','91','text',0],['vel','Índice de velocidad','V','text',0],['codigo','Código de producto','Se crea solo si lo dejas vacío','text',0],['costo','Costo (S/)','180.00','decimal',1],['precio','Precio de venta (S/)','250.00','decimal',1],['stock','Cantidad disponible','4','numeric',1],['min','Stock mínimo','2','numeric',1],['prov','Proveedor','Distribuidora Lima','text',0]];
async function formProd(c,id){const p=id?await get('products',id):{};const edit=!!id;
 c.innerHTML=`<button class="btn" id="bk" style="margin-bottom:14px">← Volver</button><h1>${edit?'Editar llanta':'Agregar llanta'}</h1>
 <form id="pf" class="card" novalidate style="margin-top:14px"><div class="grid2">${F.map(f=>(edit&&f[0]==='stock')?'':`<div><label for="f_${f[0]}">${f[1]}${f[4]?' *':''}</label><input id="f_${f[0]}" inputmode="${f[3]==='text'?'text':f[3]}" placeholder="${esc(f[2])}" value="${esc(p[f[0]]??'')}" ${f[0]==='vel'||f[0]==='codigo'?'style="text-transform:uppercase"':''}></div>`).join('')}</div>
 ${edit?'<p class="small mut" style="margin-top:12px">La cantidad se cambia con "Ajustar stock" para que quede registrado el motivo.</p>':''}
 <div id="mg" class="small mut" style="margin-top:12px"></div><div class="err" id="pe" role="alert"></div>
 <button class="btn dark full">${edit?'Guardar cambios':'Guardar llanta'}</button></form>`;
 $('#bk').onclick=()=>edit?ficha(c,id):inventario(c);
 const val=k=>{const e=$('#f_'+k);return e?e.value.trim():''};
 const mg=()=>{const co=+val('costo').replace(',','.'),pr=+val('precio').replace(',','.');$('#mg').textContent=co>0&&pr>0?`Ganancia por llanta: ${money(pr-co)} (${Math.round((pr-co)/pr*100)}%)`:''};
 $('#f_costo').oninput=$('#f_precio').oninput=mg;mg();
 $('#f_medida').onblur=e=>{e.target.value=normMedida(e.target.value)};
 $('#pf').onsubmit=async e=>{e.preventDefault();const E=m=>{$('#pe').textContent=m};
  const n={marca:val('marca'),medida:normMedida(val('medida')),modelo:val('modelo'),carga:val('carga'),vel:val('vel').toUpperCase(),codigo:val('codigo').toUpperCase(),prov:val('prov'),costo:+val('costo').replace(',','.'),precio:+val('precio').replace(',','.'),min:+val('min')};
  if(!n.marca)return E('Escribe la marca.');if(!n.medida)return E('Escribe la medida, por ejemplo 205/55R16.');

function resumenCaja(ses,sales,cash){const vs=sales.filter(s=>s.sesion===ses.id&&s.estado!=='anulada');const por={};

 const movs=cash.filter(m=>m.kind==='mov'&&m.sesion===ses.id).sort((a,b)=>b.t-a.t);const ing=r2(movs.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0)),egr=r2(movs.filter(m=>m.tipo==='egreso').reduce((a,m)=>a+m.monto,0));
 const efe=por.efectivo||0;return{por,efe,ing,egr,movs,vend:r2(vs.reduce((a,s)=>a+s.total,0)),esperado:r2(ses.inicial+efe+ing-egr)}}

let REP={p:'hoy',d:'',h:''};
function rango(){const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate());let a=d0,b=new Date(d0.getTime()+864e5),tit='Hoy';
 if(REP.p==='semana'){const w=(d0.getDay()+6)%7;a=new Date(d0.getTime()-w*864e5);tit='Esta semana'}
 if(REP.p==='mes'){a=new Date(n.getFullYear(),n.getMonth(),1);b=new Date(n.getFullYear(),n.getMonth()+1,1);tit=n.toLocaleDateString('es-PE',{month:'long',year:'numeric'})}
 if(REP.p==='rango'&&REP.d&&REP.h){const[y1,m1,d1]=REP.d.split('-').map(Number),[y2,m2,d2]=REP.h.split('-').map(Number);a=new Date(y1,m1-1,d1);b=new Date(y2,m2-1,d2+1);tit=`Del ${dCorta(a)} al ${dCorta(b.getTime()-864e5)}`}
 return{a:a.getTime(),b:b.getTime(),tit}}
async function datosReporte(){const{a,b,tit}=rango();const inR=t=>t>=a&&t<b;
 const sales=(await all('sales')).filter(s=>inR(s.t)&&s.estado!=='anulada').sort((x,y)=>x.t-y.t);const ps=await all('products');
 const total=r2(sales.reduce((x,s)=>x+s.total,0)),desc=r2(sales.reduce((x,s)=>x+(s.desc||0),0)),costo=r2(sales.reduce((x,s)=>x+s.items.reduce((y,i)=>y+(i.costo||0)*i.cant,0),0));
 const por={};for(const s of sales)por[s.metodo]=r2((por[s.metodo]||0)+s.total);
 const dias={};for(const s of sales){const k=dISO(s.t);dias[k]=r2((dias[k]||0)+s.total)}
 const vend={};for(const s of sales)for(const i of s.items.filter(i=>i.tipo==='llanta')){const v=vend[i.ref]||(vend[i.ref]={desc:i.desc,cant:0,monto:0,gan:0});v.cant+=i.cant;v.monto+=i.precio*i.cant;v.gan+=(i.precio-(i.costo||0))*i.cant}
 const top=Object.values(vend).sort((x,y)=>y.cant-x.cant||y.monto-x.monto);
 const menos=ps.filter(p=>p.activo!==false).map(p=>({desc:`${p.medida} ${p.marca} ${p.modelo}`.trim(),cant:(vend[p.id]||{cant:0}).cant,stock:p.stock})).sort((x,y)=>x.cant-y.cant||y.stock-x.stock);
 const sv=(await all('services')).filter(s=>inR(s.t)&&!s.anulado);const porServ={},porTrab={};for(const s of sv){const v=porServ[s.servicio]||(porServ[s.servicio]={n:0,m:0});v.n++;v.m+=s.precio;const w=porTrab[s.trab]||(porTrab[s.trab]={n:0,m:0});w.n++;w.m+=s.precio}
 const moves=(await all('moves')).filter(m=>inR(m.t)).sort((x,y)=>y.t-x.t);
 const compras=(await all('purchases')).filter(p=>inR(p.t));
 return{a,b,tit,sales,total,desc,costo,gan:r2(total-costo),por,dias,top,menos,sv,porServ,porTrab,moves,compras,llantas:top.reduce((x,v)=>x+v.cant,0)}}

async function reportesView(c){const R=await datosReporte();if(!c.isConnected)return;
 const barras=(obj,fmt=money)=>{const e=Object.entries(obj);const mx=Math.max(...e.map(x=>x[1]),1);return e.length?`<div class="stack" style="--g:8px">${e.map(([k,v])=>`<div><div style="display:flex;justify-content:space-between;gap:10px" class="small"><span>${esc(k)}</span><b style="white-space:nowrap">${fmt(v)}</b></div><div style="height:12px;background:var(--soft);border-radius:6px;margin-top:4px"><div style="height:100%;width:${Math.max(v/mx*100,2)}%;background:var(--asf);border-radius:6px"></div></div></div>`).join('')}</div>`:'<p class="mut">Sin datos en este periodo.</p>'};

 c.innerHTML=`<h1>Reportes</h1><div class="tabs" role="group" style="margin-top:12px">${[['hoy','Hoy'],['semana','Semana'],['mes','Mes'],['rango','Elegir fechas']].map(([v,l])=>`<button class="btn" data-pr="${v}" aria-pressed="${REP.p===v}">${l}</button>`).join('')}</div>
 ${REP.p==='rango'?`<form id="rg" class="card" novalidate style="margin-bottom:14px"><div class="grid2"><div><label for="rd" style="margin-top:0">Desde</label><input id="rd" type="date" value="${esc(REP.d)}"></div><div><label for="rh" style="margin-top:0">Hasta</label><input id="rh" type="date" value="${esc(REP.h)}"></div></div><div class="err" id="rge"></div><button class="btn dark">Ver reporte</button></form>`:''}
 <div class="hello" style="margin-bottom:12px"><h2 style="margin:0">${esc(R.tit.charAt(0).toUpperCase()+R.tit.slice(1))}</h2><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn dark" id="xl">${ico('save')}Excel</button><button class="btn" id="pdf">${ico('save')}PDF</button></div></div>
 <div class="kgrid">${k('Ventas',money(R.total),R.sales.length+' venta'+(R.sales.length===1?'':'s')+(R.desc?' · desc. '+money(R.desc):''))}${k('Ganancia estimada',money(R.gan),'Ventas menos costo de llantas')}${k('Llantas vendidas',R.llantas)}${k('Servicios realizados',R.sv.length,money(R.sv.reduce((x,s)=>x+s.precio,0)))}</div>
 <div class="grid2" style="margin-top:16px"><div class="card"><h3>Ventas por día</h3>${barras(dias)}</div><div class="card"><h3>Por forma de pago</h3>${barras(Object.fromEntries(Object.entries(R.por).map(([k,v])=>[metNom(k),v])))}</div></div>
 <div class="grid2" style="margin-top:16px"><div class="card"><h3>Llantas más vendidas</h3>${R.top.length?`<div class="list">${R.top.slice(0,10).map((v,i)=>`<div class="row" style="flex-wrap:nowrap"><span>${i+1}. ${esc(v.desc)}</span><b style="white-space:nowrap">${v.cant} uds</b></div>`).join('')}</div>`:'<p class="mut">Sin ventas de llantas.</p>'}</div>
 <div class="card"><h3>Llantas menos vendidas</h3>${R.menos.length?`<div class="list">${R.menos.slice(0,10).map(v=>`<div class="row" style="flex-wrap:nowrap"><span>${esc(v.desc)}<div class="small mut">Stock ${v.stock}</div></span><b style="white-space:nowrap">${v.cant} uds</b></div>`).join('')}</div>`:'<p class="mut">Sin llantas registradas.</p>'}</div></div>
 <div class="grid2" style="margin-top:16px"><div class="card"><h3>Servicios realizados</h3>${barras(Object.fromEntries(Object.entries(R.porServ).map(([k,v])=>[`${k} (${v.n})`,v.m])))}</div><div class="card"><h3>Servicios por trabajador</h3>${barras(Object.fromEntries(Object.entries(R.porTrab).map(([k,v])=>[`${k} (${v.n})`,v.m])))}</div></div>
 <div class="card" style="margin-top:16px"><h3>Movimientos de inventario (${R.moves.length})</h3>${R.moves.length?`<div class="list">${R.moves.slice(0,50).map(m=>`<div class="row"><div><b>${m.cant>0?'+':''}${m.cant}</b> ${esc(m.desc)}<div class="small mut">${esc(m.motivo)} · ${esc(m.user)}</div></div><span class="small mut">${fecha(m.t)}</span></div>`).join('')}</div>${R.moves.length>50?'<p class="small mut">Mostrando 50. El Excel tiene todos.</p>':''}`:'<p class="mut">Sin movimientos.</p>'}</div>`;
 c.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{REP.p=b.dataset.pr;if(REP.p==='rango'&&!REP.d){REP.d=dISO(Date.now()-6*864e5);REP.h=dISO(Date.now())}reportesView(c)});

  const blob=xlsx([{name:'Resumen',rows:res},{name:'Ventas detalle',rows:det},

  await saveBlob(`llantex_reporte_${dISO(R.a)}_a_${dISO(R.b-864e5)}.xlsx`,blob);await log('Reporte exportado','Excel · '+R.tit)};
 $('#pdf').onclick=async()=>{let p=$('#print');if(!p){p=document.createElement('div');p.id='print';document.body.append(p)}
